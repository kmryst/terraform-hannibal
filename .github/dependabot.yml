version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # root（NestJS backend）。devDependencies は npm-dev グループに集約し、
  # production 依存は個別 PR のまま残す（idp-golden-path の root エントリと同じ構成）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # TypeScript 6.1 以降は @typescript-eslint/eslint-plugin が未対応。
      # 実測: 8.66.0（最新）の peer は typescript ">=4.8.4 <6.1.0"。
      # 影響: root は npm ci が ERESOLVE で失敗（PR #537）、
      #       client は TS5108 esModuleInterop 廃止でビルド失敗（PR #532、client/tsconfig.json:8）。
      # 本番影響なし: typescript は devDependency でビルド時のみ。
      # 解除条件: @typescript-eslint/eslint-plugin の peer から <6.1.0 の上限が外れたら。
      # 見直し期限: 2026-11-02（idp-golden-path #134 / #146 の棚卸し時期と揃える）
      # 追跡: Issue #542
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint v9 で flat config が既定になり、v10 で eslintrc 形式のサポートが削除された。
      # 本リポジトリは .eslintrc.js（旧形式）のままで flat config 未移行。
      # 実測: PR #546 の Backend Lint & Build / Backend Test が
      #       「ESLint: 10.8.0 / ESLint couldn't find an eslint.config.(js|mjs|cjs) file.」で失敗。
      # 本番影響なし: eslint は devDependency で lint 時のみ。
      # 解除条件: flat config（eslint.config.js）への移行完了時にこの ignore を削除する
      #           （上流対応待ちではなく、本リポジトリ自身の移行作業が解除条件）。
      # 見直し期限: 2026-11-02（typescript ignore / idp-golden-path #134・#146 と揃える）
      # 追跡: Issue #551
      # client には ESLint 関連の依存も lint script も存在しないため /client には追加しない。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node の major は runtime major と一致させる contract
      # （docs/operations/dependency-management.md「runtime majorと型定義majorを一致させる」）に従う。
      # runtime は Node 24（node:24-alpine / engines >=24 <25）のため、26 系の型定義は
      # 「runtime に存在しない API が型チェックを通る」リスクがあり採用しない（PR #554 で 26.1.2 が提案された）。
      # 本番影響なし: @types/node は devDependency で型チェック時のみ。
      # 解除条件: Node runtime の major 更新（node:24-alpine / setup-node / engines の更新）と同時に外す。
      # 見直し期限: 2026-11-02（#542 / #551 と揃える）
      # 追跡: Issue #555
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # client/（React frontend）。root とは独立した npm プロジェクト（client/package-lock.json）
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # react / react-dom と @types/react* は密結合しており、単独更新すると
      # 相方が取り残されて CI が壊れる（idp-golden-path PR #53 / #54 / #56 で発生）。
      # Dependabot は「複数グループにマッチする依存は最初にマッチしたグループに入る」
      # （first-match-wins）ため、@types/react* を npm-dev ではなく react グループに
      # 入れるべく、react グループを npm-dev より前に置く
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # TypeScript 6.1 以降は @typescript-eslint/eslint-plugin が未対応。
      # 実測: 8.66.0（最新）の peer は typescript ">=4.8.4 <6.1.0"。
      # 影響: root は npm ci が ERESOLVE で失敗（PR #537）、
      #       client は TS5108 esModuleInterop 廃止でビルド失敗（PR #532、client/tsconfig.json:8）。
      # 本番影響なし: typescript は devDependency でビルド時のみ。
      # 解除条件: @typescript-eslint/eslint-plugin の peer から <6.1.0 の上限が外れたら。
      # 見直し期限: 2026-11-02（idp-golden-path #134 / #146 の棚卸し時期と揃える）
      # 追跡: Issue #542
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
